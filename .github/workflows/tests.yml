name: Local-safe checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt -c requirements-constraints.txt
      - run: python -m pip check
      - run: sudo apt-get update && sudo apt-get install -y age
      - run: python -m unittest discover -s tests
      - run: node --test launcher/test.mjs
      - run: python tools/build_site.py
      - run: python tools/check_public.py
      - name: Bash syntax only
        shell: bash
        run: |
          for file in deploy/*.sh deploy/access-site; do bash -n "$file"; done
